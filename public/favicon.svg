    <rect x="44" y="38" width="16" height="14" rx="2" fill="#ffffff" transform="skewY(-12)" />
  </g>

  <!-- Lightbulb -->
  <path d="M 152 178 C 136 150 140 100 178 72 C 218 45 270 65 276 112 C 280 144 260 166 248 178 C 242 186 238 196 238 206 L 162 206 C 162 196 158 186 152 178 Z" stroke="#18181b" stroke-width="12" fill="#ffffff" />
